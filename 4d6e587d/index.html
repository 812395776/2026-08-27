<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>妙名阁 · 宝宝起名</title>
<style>
  :root {
    --paper: #f7f2e9;
    --card: #fffdf8;
    --ink: #2d2a26;
    --ink-soft: #6f6a61;
    --cinnabar: #b8432f;
    --cinnabar-dark: #9a3524;
    --gold: #b98a2f;
    --line: #e6ddcd;
    --shadow: 0 6px 24px rgba(80, 60, 30, .08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(184, 67, 47, .05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(185, 138, 47, .06), transparent 40%),
      var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  header { position: relative; text-align: center; padding: 48px 16px 8px; }
  .seal {
    display: inline-block; font-family: "Songti SC", "STSong", serif;
    font-size: 14px; color: #fff; background: var(--cinnabar);
    padding: 6px 10px; border-radius: 6px; letter-spacing: 4px; margin-bottom: 14px;
  }
  header h1 {
    font-family: "Songti SC", "STSong", "SimSun", serif;
    font-size: 40px; letter-spacing: 12px; text-indent: 12px; font-weight: 700;
  }
  header p { color: var(--ink-soft); margin-top: 10px; letter-spacing: 2px; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  .panel {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow); padding: 28px; margin-bottom: 24px;
  }
  .panel h2 {
    font-family: "Songti SC", "STSong", serif; font-size: 20px;
    display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
  }
  .panel h2::before { content: ""; width: 6px; height: 20px; background: var(--cinnabar); border-radius: 3px; }
  .panel h2 .hint { font-size: 13px; color: var(--ink-soft); font-family: inherit; font-weight: 400; margin-left: auto; }

  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px 28px; }
  .field { display: flex; flex-direction: column; gap: 10px; }
  .field.full { grid-column: 1 / -1; }
  .field > label { font-size: 14px; color: var(--ink-soft); letter-spacing: 1px; }
  input[type="text"], select {
    border: 1px solid var(--line); border-radius: 8px; background: #fff;
    padding: 11px 14px; font-size: 16px; color: var(--ink); outline: none;
    transition: border-color .2s, box-shadow .2s; font-family: inherit;
  }
  input[type="text"]:focus, select:focus { border-color: var(--cinnabar); box-shadow: 0 0 0 3px rgba(184,67,47,.1); }
  input.error { border-color: var(--cinnabar); animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px);} 75% { transform: translateX(4px);} }

  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg input { display: none; }
  .seg span {
    display: inline-block; padding: 8px 18px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; font-size: 14px;
    cursor: pointer; user-select: none; transition: all .15s; color: var(--ink);
  }
  .seg span:hover { border-color: var(--gold); }
  .seg input:checked + span { background: var(--cinnabar); border-color: var(--cinnabar); color: #fff; }

  .actions { display: flex; align-items: center; gap: 14px; margin-top: 26px; flex-wrap: wrap; }
  .btn {
    border: none; border-radius: 10px; padding: 13px 34px; font-size: 16px;
    cursor: pointer; letter-spacing: 4px; transition: all .15s; font-family: inherit;
  }
  .btn-primary { background: var(--cinnabar); color: #fff; box-shadow: 0 4px 14px rgba(184,67,47,.3); }
  .btn-primary:hover { background: var(--cinnabar-dark); }
  .btn-primary:active { transform: scale(.97); }
  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); padding: 12px 22px; letter-spacing: 2px; }
  .btn-ghost:hover { border-color: var(--gold); color: var(--ink); }
  #errTip { color: var(--cinnabar); font-size: 14px; min-height: 20px; }

  #resultsPanel[hidden] { display: none; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 16px; }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 20px 18px 16px; display: flex; flex-direction: column; gap: 10px;
    animation: fadeUp .45s ease both; position: relative; transition: transform .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px);} to { opacity: 1; transform: none;} }
  .card .name {
    font-family: "Songti SC", "STSong", serif; font-size: 30px; letter-spacing: 6px;
    text-indent: 6px; text-align: center; font-weight: 700;
  }
  .card .pinyin { text-align: center; color: var(--gold); font-size: 13px; letter-spacing: 2px; min-height: 18px; }
  .card .meaning { font-size: 13px; color: var(--ink-soft); line-height: 1.7; flex: 1; }
  .card .meaning b { color: var(--cinnabar); font-weight: 600; }
  .card .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; background: rgba(185,138,47,.12); color: #8a6a26; padding: 3px 8px; border-radius: 999px; }
  .card-ops { display: flex; gap: 8px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .card-ops button {
    flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 8px;
    padding: 7px 0; font-size: 13px; cursor: pointer; color: var(--ink-soft); transition: all .15s;
  }
  .card-ops button:hover { border-color: var(--cinnabar); color: var(--cinnabar); }
  .card-ops button.faved { background: var(--cinnabar); border-color: var(--cinnabar); color: #fff; }

  .fav-item {
    display: flex; align-items: center; gap: 14px; padding: 12px 6px;
    border-bottom: 1px dashed var(--line); animation: fadeUp .3s ease both;
  }
  .fav-item:last-child { border-bottom: none; }
  .fav-item .fav-name { font-family: "Songti SC", "STSong", serif; font-size: 20px; letter-spacing: 3px; min-width: 110px; }
  .fav-item .fav-meaning { font-size: 12px; color: var(--ink-soft); flex: 1; line-height: 1.6; }
  .fav-item button {
    border: 1px solid var(--line); background: #fff; border-radius: 8px;
    padding: 5px 12px; font-size: 12px; cursor: pointer; color: var(--ink-soft); white-space: nowrap;
  }
  .fav-item button:hover { border-color: var(--cinnabar); color: var(--cinnabar); }
  .fav-item button.del:hover { border-color: #c0392b; color: #c0392b; }
  .empty { color: var(--ink-soft); font-size: 14px; text-align: center; padding: 18px 0; }

  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px);
    background: rgba(45,42,38,.92); color: #fff; padding: 10px 22px; border-radius: 999px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 99;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer { text-align: center; color: var(--ink-soft); font-size: 12px; padding: 0 16px 40px; letter-spacing: 1px; }

  /* ---- 账号系统 ---- */
  .user-bar {
    position: absolute; top: 22px; right: 22px;
    display: flex; align-items: center; gap: 10px;
  }
  .user-bar .user-name {
    font-size: 13px; color: var(--ink-soft); letter-spacing: 1px;
    max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .btn-sm { padding: 7px 16px; font-size: 13px; letter-spacing: 2px; border-radius: 8px; box-shadow: none; }

  .modal-mask {
    position: fixed; inset: 0; background: rgba(45,42,38,.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 16px; animation: fadeIn .2s ease;
  }
  .modal-mask[hidden] { display: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; box-shadow: 0 20px 60px rgba(80,60,30,.25);
    width: 100%; max-width: 380px; padding: 30px 28px 24px;
    position: relative; animation: pop .25s ease both;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }
  .modal-close {
    position: absolute; top: 12px; right: 14px; border: none; background: none;
    font-size: 22px; color: var(--ink-soft); cursor: pointer; line-height: 1; transition: color .15s;
  }
  .modal-close:hover { color: var(--cinnabar); }
  .modal h3 {
    font-family: "Songti SC", "STSong", serif; font-size: 22px;
    text-align: center; letter-spacing: 6px; text-indent: 6px; margin-bottom: 18px;
  }
  .auth-tabs { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .auth-tabs .tab {
    flex: 1; background: none; border: none; padding: 10px 0; font-size: 15px;
    color: var(--ink-soft); cursor: pointer; letter-spacing: 4px;
    border-bottom: 2px solid transparent; transition: all .15s; font-family: inherit;
  }
  .auth-tabs .tab.active { color: var(--cinnabar); border-bottom-color: var(--cinnabar); font-weight: 600; }
  .modal .field { margin-bottom: 14px; }
  .modal input {
    width: 100%; border: 1px solid var(--line); border-radius: 8px;
    background: #fff; padding: 11px 14px; font-size: 15px; color: var(--ink);
    outline: none; font-family: inherit; transition: border-color .2s, box-shadow .2s;
  }
  .modal input:focus { border-color: var(--cinnabar); box-shadow: 0 0 0 3px rgba(184,67,47,.1); }
  .modal input.error { border-color: var(--cinnabar); animation: shake .3s; }
  .auth-err { color: var(--cinnabar); font-size: 13px; min-height: 18px; margin-bottom: 6px; }
  .btn-block { width: 100%; text-align: center; }
  .auth-tip { text-align: center; font-size: 12px; color: var(--ink-soft); margin-top: 14px; line-height: 1.7; }

  @media (max-width: 640px) {
    header h1 { font-size: 30px; letter-spacing: 8px; text-indent: 8px; }
    .user-bar { position: static; justify-content: center; margin-top: 14px; }
    .form-grid { grid-template-columns: 1fr; }
    .panel { padding: 20px 16px; }
    .fav-item { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header>
  <span class="seal">妙名阁</span>
  <h1>宝宝起名</h1>
  <p>赐子千金，不如赐子好名 —— 愿每个名字都承载着美好的期许</p>
  <div class="user-bar">
    <span class="user-name" id="userName" hidden></span>
    <button class="btn btn-ghost btn-sm" id="logoutBtn" hidden>退出登录</button>
    <button class="btn btn-primary btn-sm" id="loginBtn">登录 / 注册</button>
  </div>
</header>

<main>
  <section class="panel">
    <h2>起名条件</h2>
    <div class="form-grid">
      <div class="field">
        <label>姓氏（必填，支持复姓）</label>
        <input type="text" id="surname" maxlength="2" placeholder="如：林 / 欧阳" autocomplete="off">
      </div>
      <div class="field">
        <label>生成数量</label>
        <select id="count">
          <option value="6">6 个</option>
          <option value="8" selected>8 个</option>
          <option value="12">12 个</option>
        </select>
      </div>
      <div class="field">
        <label>宝宝性别</label>
        <div class="seg" id="genderSeg">
          <label><input type="radio" name="gender" value="M"><span>男宝宝</span></label>
          <label><input type="radio" name="gender" value="F" checked><span>女宝宝</span></label>
          <label><input type="radio" name="gender" value="N"><span>不限</span></label>
        </div>
      </div>
      <div class="field">
        <label>名字字数</label>
        <div class="seg" id="lenSeg">
          <label><input type="radio" name="len" value="1"><span>单字名</span></label>
          <label><input type="radio" name="len" value="2" checked><span>双字名</span></label>
          <label><input type="radio" name="len" value="0"><span>都可以</span></label>
        </div>
      </div>
      <div class="field full">
        <label>风格偏好（可多选，不选则综合推荐）</label>
        <div class="seg" id="styleSeg">
          <label><input type="checkbox" name="style" value="poem"><span>诗词典故</span></label>
          <label><input type="checkbox" name="style" value="sun"><span>阳光开朗</span></label>
          <label><input type="checkbox" name="style" value="gentle"><span>温婉雅致</span></label>
          <label><input type="checkbox" name="style" value="ambition"><span>志向远大</span></label>
          <label><input type="checkbox" name="style" value="nature"><span>自然山水</span></label>
          <label><input type="checkbox" name="style" value="simple"><span>简单好记</span></label>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="generateBtn">生成名字</button>
      <span id="errTip"></span>
    </div>
  </section>

  <section class="panel" id="resultsPanel" hidden>
    <h2>推荐名字 <span class="hint" id="resultHint"></span></h2>
    <div class="cards" id="cards"></div>
    <div class="actions" style="margin-top:22px;">
      <button class="btn btn-ghost" id="againBtn">换一批</button>
    </div>
  </section>

  <section class="panel">
    <h2>我的收藏 <span class="hint" id="favCount"></span></h2>
    <div id="favList"></div>
  </section>
</main>

<!-- 登录 / 注册弹窗 -->
<div class="modal-mask" id="authModal" hidden>
  <div class="modal">
    <button class="modal-close" id="authClose" type="button" aria-label="关闭">×</button>
    <h3>妙名阁</h3>
    <div class="auth-tabs">
      <button class="tab active" type="button" data-tab="login">登 录</button>
      <button class="tab" type="button" data-tab="register">注 册</button>
    </div>
    <form id="authForm" novalidate>
      <div class="field">
        <label for="authUser">用户名</label>
        <input type="text" id="authUser" maxlength="20" placeholder="2-20 位中英文、数字或下划线" autocomplete="username">
      </div>
      <div class="field">
        <label for="authPass">密码</label>
        <input type="password" id="authPass" maxlength="64" placeholder="至少 6 位" autocomplete="current-password">
      </div>
      <div class="field" id="confirmField" hidden>
        <label for="authPass2">确认密码</label>
        <input type="password" id="authPass2" maxlength="64" placeholder="再次输入密码" autocomplete="new-password">
      </div>
      <div class="auth-err" id="authErr"></div>
      <button class="btn btn-primary btn-block" id="authSubmit" type="submit">登 录</button>
      <div class="auth-tip">账号与收藏保存在本机浏览器中<br>请勿使用重要密码</div>
    </form>
  </div>
</div>

<footer>名字由本地字库随机组合生成，仅供灵感参考，请结合家庭喜好审慎选择。</footer>
<div class="toast" id="toast"></div>

const $ = (id) => document.getElementById(id);

/* ---------- 账号系统（基于浏览器本地存储的演示实现） ---------- */
const USERS_KEY = "mmg-users";
const SESSION_KEY = "mmg-session";

function loadUsers() { try { return JSON.parse(localStorage.getItem(USERS_KEY) || "{}"); } catch { return {}; } }
function saveUsers(users) { localStorage.setItem(USERS_KEY, JSON.stringify(users)); }
function currentUser() { return localStorage.getItem(SESSION_KEY) || ""; }

async function hashPass(pw, salt) {
  const text = `${salt}::${pw}`;
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }
  // 非安全上下文（如 file:// 直接打开）时的降级哈希
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (let i = 0; i < text.length; i++) {
    h1 = (h1 ^ text.charCodeAt(i)) >>> 0;
    h1 = Math.imul(h1, 16777619) >>> 0;
    h2 = (h2 + text.charCodeAt(i)) >>> 0;
    h2 = Math.imul(h2, 2654435761) >>> 0;
  }
  return `${h1.toString(16)}${h2.toString(16)}${text.length.toString(16)}`;
}
function randSalt() {
  const arr = new Uint8Array(8);
  crypto.getRandomValues(arr);
  return [...arr].map(b => b.toString(16).padStart(2, "0")).join("");
}

const authModal = $("authModal");
let authMode = "login";

function openAuth(tab) {
  authMode = tab || "login";
  $("authErr").textContent = "";
  [...authModal.querySelectorAll(".tab")].forEach(t => t.classList.toggle("active", t.dataset.tab === authMode));
  $("confirmField").hidden = authMode !== "register";
  $("authSubmit").textContent = authMode === "register" ? "注 册" : "登 录";
  $("authUser").value = $("authPass").value = $("authPass2").value = "";
  authModal.hidden = false;
  setTimeout(() => $("authUser").focus(), 60);
}
function closeAuth() { authModal.hidden = true; }

async function submitAuth(e) {
  e.preventDefault();
  const err = $("authErr");
  err.textContent = "";
  const userEl = $("authUser"), passEl = $("authPass");
  userEl.classList.remove("error"); passEl.classList.remove("error");
  $("authPass2").classList.remove("error");
  const username = userEl.value.trim();
  const password = passEl.value;
  if (!/^[\w\u4e00-\u9fa5]{2,20}$/.test(username)) {
    err.textContent = "用户名需为 2-20 位中英文、数字或下划线";
    userEl.classList.add("error"); return;
  }
  if (password.length < 6) {
    err.textContent = "密码至少 6 位";
    passEl.classList.add("error"); return;
  }
  const users = loadUsers();
  if (authMode === "register") {
    const pass2 = $("authPass2").value;
    if (password !== pass2) {
      err.textContent = "两次输入的密码不一致";
      $("authPass2").classList.add("error"); return;
    }
    if (users[username]) {
      err.textContent = "该用户名已被注册，请直接登录";
      userEl.classList.add("error"); return;
    }
    const salt = randSalt();
    users[username] = { salt, hash: await hashPass(password, salt), createdAt: Date.now() };
    saveUsers(users);
    localStorage.setItem(SESSION_KEY, username);
    toast(`注册成功，欢迎您，${username}`);
  } else {
    const rec = users[username];
    if (!rec || (await hashPass(password, rec.salt)) !== rec.hash) {
      err.textContent = "用户名或密码不正确";
      passEl.classList.add("error"); return;
    }
    localStorage.setItem(SESSION_KEY, username);
    toast(`欢迎回来，${username}`);
  }
  closeAuth();
  applyAuthUI();
  loadFavs();
}

function applyAuthUI() {
  const u = currentUser();
  $("userName").textContent = u;
  $("userName").hidden = !u;
  $("logoutBtn").hidden = !u;
  $("loginBtn").hidden = !!u;
}

function logout() {
  localStorage.removeItem(SESSION_KEY);
  toast("已退出登录");
  applyAuthUI();
  loadFavs();
}

/* ---------- 收藏（按账号隔离存储） ---------- */
let favorites = [];
function favKey() { const u = currentUser(); return u ? `mmg-favs-${u}` : ""; }
function loadFavs() {
  favorites = [];
  const key = favKey();
  if (key) { try { favorites = JSON.parse(localStorage.getItem(key) || "[]"); } catch { favorites = []; } }
  renderFavs();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function poolFor(gender) {
  if (gender === "N") return CHARS;
  return CHARS.filter(c => c.g === gender || c.g === "N");
}

function pickGiven(pool, len, styles, surnameChars) {
  const preferred = styles.length ? pool.filter(c => c.t.some(s => styles.includes(s))) : pool;
  const source = preferred.length >= len ? preferred : pool;
  const banned = new Set(surnameChars);
  const picked = [];
  for (const c of shuffle([...source])) {
    if (banned.has(c.c)) continue;
    picked.push(c);
    banned.add(c.c);
    if (picked.length === len) return picked;
  }
  return null;
}

function generate() {
  const surname = surnameInput.value.trim();
  const tip = $("errTip");
  surnameInput.classList.remove("error");
  tip.textContent = "";
  if (!surname) {
    tip.textContent = "请先输入姓氏";
    surnameInput.classList.add("error");
    surnameInput.focus();
    return;
  }
  const gender = document.querySelector('input[name="gender"]:checked').value;
  const lenChoice = Number(document.querySelector('input[name="len"]:checked').value);
  const styles = [...document.querySelectorAll('input[name="style"]:checked')].map(i => i.value);
  const count = Number($("count").value);
  const surnameChars = [...surname];
  const pool = poolFor(gender);
  const seen = new Set();
  const results = [];
  let guard = 0;
  while (results.length < count && guard++ < 600) {
    const len = lenChoice === 0 ? (Math.random() < 0.5 ? 1 : 2) : lenChoice;
    const given = pickGiven(pool, len, styles, surnameChars);
    if (!given) break;
    const name = surname + given.map(c => c.c).join("");
    if (seen.has(name)) continue;
    seen.add(name);
    results.push({ name, given });
  }
  renderResults(results, surname);
}

function isFaved(name) { return favorites.some(f => f.name === name); }

function meaningHtml(given) {
  return given.map(c => `<b>${c.c}</b> ${c.m}`).join("；");
}

function renderResults(results) {
  $("resultsPanel").hidden = results.length === 0;
  $("resultHint").textContent = results.length ? `共 ${results.length} 个，点击「收藏」留存心仪之选` : "";
  cardsEl.innerHTML = "";
  results.forEach((r, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.animationDelay = (i * 0.05) + "s";
    const pinyin = r.given.map(c => c.p).join(" ");
    const faved = isFaved(r.name);
    const tags = [...new Set(r.given.flatMap(c => c.t))].slice(0, 3)
      .map(s => `<span class="tag">${STYLES[s]}</span>`).join("");
    card.innerHTML = `
      <div class="name">${r.name}</div>
      <div class="pinyin">${pinyin}</div>
      <div class="meaning">${meaningHtml(r.given)}</div>
      <div class="tags">${tags}</div>
      <div class="card-ops">
        <button data-act="fav">${faved ? "已收藏 ♥" : "收藏 ♡"}</button>
        <button data-act="copy">复制</button>
      </div>`;
    card.querySelector('[data-act="fav"]').classList.toggle("faved", faved);
    card.querySelector('[data-act="fav"]').addEventListener("click", () => toggleFav(r, card.querySelector('[data-act="fav"]')));
    card.querySelector('[data-act="copy"]').addEventListener("click", () => copyText(r.name));
    cardsEl.appendChild(card);
  });
}

function toggleFav(r, btn) {
  if (!currentUser()) { openAuth("login"); toast("请先登录后再收藏"); return; }
  if (isFaved(r.name)) {
    favorites = favorites.filter(f => f.name !== r.name);
    if (btn) { btn.textContent = "收藏 ♡"; btn.classList.remove("faved"); }
    toast(`已取消收藏「${r.name}」`);
  } else {
    favorites.unshift({ name: r.name, pinyin: r.given.map(c => c.p).join(" "), meaning: meaningHtml(r.given) });
    if (btn) { btn.textContent = "已收藏 ♥"; btn.classList.add("faved"); }
    toast(`已收藏「${r.name}」`);
  }
  localStorage.setItem(favKey(), JSON.stringify(favorites));
  renderFavs();
}

function renderFavs() {
  $("favCount").textContent = favorites.length ? `${favorites.length} 个` : "";
  if (!currentUser()) {
    favListEl.innerHTML = `<div class="empty">登录账号后即可收藏心仪的名字，收藏将保存在你的账号名下。</div>`;
    return;
  }
  if (!favorites.length) {
    favListEl.innerHTML = `<div class="empty">还没有收藏，生成名字后点击「收藏」即可留存。</div>`;
    return;
  }
  favListEl.innerHTML = "";
  favorites.forEach(f => {
    const row = document.createElement("div");
    row.className = "fav-item";
    row.innerHTML = `
      <span class="fav-name">${f.name}</span>
      <span class="fav-meaning">${f.meaning}</span>
      <button data-act="copy">复制</button>
      <button data-act="del" class="del">删除</button>`;
    row.querySelector('[data-act="copy"]').addEventListener("click", () => copyText(f.name));
    row.querySelector('[data-act="del"]').addEventListener("click", () => {
      favorites = favorites.filter(x => x.name !== f.name);
      localStorage.setItem(favKey(), JSON.stringify(favorites));
      renderFavs();
      toast(`已删除「${f.name}」`);
    });
    favListEl.appendChild(row);
  });
}

function copyText(text) {
  const done = () => toast(`已复制「${text}」`);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch { toast("复制失败，请手动复制"); }
  ta.remove();
}

let toastTimer;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

$("generateBtn").addEventListener("click", generate);
$("againBtn").addEventListener("click", generate);
surnameInput.addEventListener("keydown", e => { if (e.key === "Enter") generate(); });

/* 账号系统初始化 */
$("loginBtn").addEventListener("click", () => openAuth("login"));
$("logoutBtn").addEventListener("click", logout);
$("authClose").addEventListener("click", closeAuth);
authModal.addEventListener("click", e => { if (e.target === authModal) closeAuth(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !authModal.hidden) closeAuth(); });
authModal.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => openAuth(t.dataset.tab)));
$("authForm").addEventListener("submit", submitAuth);

applyAuthUI();
loadFavs();
